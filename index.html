<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IS3B9 Database </title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#222;
}

.search-box{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:400px;
    padding:10px;
    font-size:16px;
    border:1px solid #aaa;
    border-radius:4px;
}

.table-container{
    overflow-x:auto;
    background:white;
    padding:10px;
    border:1px solid #ccc;
    border-radius:4px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#444;
    color:white;
}

th, td{
    border:1px solid #999;
    padding:10px;
    text-align:left;
    font-size:14px;
}

tr:nth-child(even){
    background:#f9f9f9;
}

.stats{
    text-align:center;
    margin-top:12px;
    font-size:13px;
    color:#555;
}

</style>
</head>
<body>

<h1>IS3B9 SQL TABLE </h1>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск: студент, предмет, учитель, оценка, ID, группа...">
</div>

<div class="table-container">

<table id="dataTable">
<thead>
<tr>
    <th>grade_id</th>
    <th>student_id</th>
    <th>student_name</th>
    <th>group_name</th>
    <th>subject_id</th>
    <th>subject_name</th>
    <th>teacher_id</th>
    <th>teacher_name</th>
    <th>grade</th>
</tr>
</thead>
<tbody id="tableBody">
    <!-- Все 184 строки генерируются динамически через JavaScript -->
</tbody>
</table>

</div>

<div class="stats" id="rowCounter">Загрузка данных...</div>

<script>
    // ==============================================================
    // ПОЛНЫЕ ДАННЫЕ КОЛЛЕДЖА (ИС3Б9)
    // 23 студента, 8 предметов, 5 учителей
    // Формируем CROSS JOIN: каждый студент × каждый предмет = 184 оценки
    // Каждая строка содержит все поля: grade_id, student_id, student_name, 
    // group_name, subject_id, subject_name, teacher_id, teacher_name, grade
    // ==============================================================

    // ---------- 1. УЧИТЕЛЯ ----------
    const TEACHERS = [
        { teacher_id: 1, full_name: "Әлғайпа Ғ.П." },
        { teacher_id: 2, full_name: "Әбдіқапар М." },
        { teacher_id: 3, full_name: "Токенова Ж.М." },
        { teacher_id: 4, full_name: "Абылкасенов Б.С." },
        { teacher_id: 5, full_name: "Қалқабек Е.М." }
    ];

    // ---------- 2. ПРЕДМЕТЫ (с привязкой к учителю) ----------
    const SUBJECTS = [
        { subject_id: 1, subject_name: "Front-end және back-end web-ресурстарын құру", teacher_id: 1 },
        { subject_id: 2, subject_name: "Бағдарламалық және аппараттық құралдардың мүмкіндіктерін пайдалану", teacher_id: 2 },
        { subject_id: 3, subject_name: "Бағдарламалық және аппараттық құралдардың үздіксіз жұмыс істеуін қамтамасыз ету", teacher_id: 3 },
        { subject_id: 4, subject_name: "Ұйымның серверлік жабдықтарын монтаждау", teacher_id: 2 },
        { subject_id: 5, subject_name: "Сервистік бағдарламалар мен жабдықтарды басқару", teacher_id: 2 },
        { subject_id: 6, subject_name: "Дене қасиеттерін дамыту және жетілдіру", teacher_id: 4 },
        { subject_id: 7, subject_name: "W3C стандарттарына сәйкес веб-беттерді орналастыру", teacher_id: 2 },
        { subject_id: 8, subject_name: "Ұйымның жергілікті есептеу желісін орнату", teacher_id: 5 }
    ];

    // ---------- 3. СТУДЕНТЫ (23 человека, группа ИС3Б9) ----------
    const STUDENTS = [
        { student_id: 1, full_name: "Ануарбек Арда", group_name: "ИС3Б9" },
        { student_id: 2, full_name: "Алмасқан Алинұр", group_name: "ИС3Б9" },
        { student_id: 3, full_name: "Ауызбеков Ерасыл", group_name: "ИС3Б9" },
        { student_id: 4, full_name: "Алтай Алишер", group_name: "ИС3Б9" },
        { student_id: 5, full_name: "Әбдікәрім Әкежан", group_name: "ИС3Б9" },
        { student_id: 6, full_name: "Берік Батыр", group_name: "ИС3Б9" },
        { student_id: 7, full_name: "Дидарқызы Нұрай", group_name: "ИС3Б9" },
        { student_id: 8, full_name: "Есімханов Жалғас", group_name: "ИС3Б9" },
        { student_id: 9, full_name: "Ерболатұлы Ералы", group_name: "ИС3Б9" },
        { student_id: 10, full_name: "Ерханат Аружан", group_name: "ИС3Б9" },
        { student_id: 11, full_name: "Еркінбекұлы Ақжол", group_name: "ИС3Б9" },
        { student_id: 12, full_name: "Жукоков Мансұр", group_name: "ИС3Б9" },
        { student_id: 13, full_name: "Жұмабек Арна", group_name: "ИС3Б9" },
        { student_id: 14, full_name: "Қайратұлы Эльдар", group_name: "ИС3Б9" },
        { student_id: 15, full_name: "Миратұлы Әзім", group_name: "ИС3Б9" },
        { student_id: 16, full_name: "Ришадұлы Нұрдәулет", group_name: "ИС3Б9" },
        { student_id: 17, full_name: "Сейтқалиев Алихан", group_name: "ИС3Б9" },
        { student_id: 18, full_name: "Советова Айдана", group_name: "ИС3Б9" },
        { student_id: 19, full_name: "Серікова Дильназ", group_name: "ИС3Б9" },
        { student_id: 20, full_name: "Самарбекова Алтынай", group_name: "ИС3Б9" },
        { student_id: 21, full_name: "Тұрсынғалиева Алима", group_name: "ИС3Б9" },
        { student_id: 22, full_name: "Тоқтарбеков Ералы", group_name: "ИС3Б9" },
        { student_id: 23, full_name: "Нұрлан Ернұр", group_name: "ИС3Б9" }
    ];

    // ---------- 4. ГЕНЕРАЦИЯ ВСЕХ ОЦЕНОК (каждый студент × каждый предмет) ----------
    // Создаём 184 оценки с реалистичными баллами от 55 до 100
    function generateAllGrades() {
        const allGrades = [];
        let gradeCounter = 1;
        
        for (const student of STUDENTS) {
            for (const subject of SUBJECTS) {
                // Детерминированная, но разнообразная оценка
                let raw = 55 + ((student.student_id * 11 + subject.subject_id * 17) % 43);
                if (raw > 100) raw = 94;
                if (raw < 52) raw = 63;
                const finalGrade = Math.min(100, Math.max(50, raw));
                allGrades.push({
                    grade_id: gradeCounter++,
                    student_id: student.student_id,
                    subject_id: subject.subject_id,
                    grade: finalGrade
                });
            }
        }
        return allGrades;
    }
    
    const GRADES = generateAllGrades(); // ровно 184 оценки
    console.log("Сгенерировано оценок:", GRADES.length); // 184
    
    // ---------- 5. ПОСТРОЕНИЕ ПОЛНОЙ JOIN-ТАБЛИЦЫ (объединение всех данных) ----------
    // Создаём карты для быстрого доступа
    const teacherMap = new Map();
    TEACHERS.forEach(t => teacherMap.set(t.teacher_id, t));
    
    const subjectMap = new Map();
    SUBJECTS.forEach(sub => subjectMap.set(sub.subject_id, sub));
    
    const studentMap = new Map();
    STUDENTS.forEach(s => studentMap.set(s.student_id, s));
    
    // Формируем массив строк (каждая строка = результат FULL JOIN)
    function buildJoinRows() {
        const rows = [];
        for (const grade of GRADES) {
            const student = studentMap.get(grade.student_id);
            if (!student) continue;
            const subject = subjectMap.get(grade.subject_id);
            if (!subject) continue;
            const teacher = teacherMap.get(subject.teacher_id);
            if (!teacher) continue;
            
            rows.push({
                grade_id: grade.grade_id,
                student_id: student.student_id,
                student_name: student.full_name,
                group_name: student.group_name,
                subject_id: subject.subject_id,
                subject_name: subject.subject_name,
                teacher_id: teacher.teacher_id,
                teacher_name: teacher.full_name,
                grade: grade.grade
            });
        }
        return rows;
    }
    
    let fullJoinData = buildJoinRows();
    
    // Проверка: должно быть 23 × 8 = 184 строки
    if (fullJoinData.length !== 184) {
        console.warn("Пересборка данных...");
        // Принудительная перегенерация с исправлением
        const freshGrades = generateAllGrades();
        const freshRows = [];
        for (const g of freshGrades) {
            const s = studentMap.get(g.student_id);
            const sub = subjectMap.get(g.subject_id);
            const t = sub ? teacherMap.get(sub.teacher_id) : null;
            if (s && sub && t) {
                freshRows.push({
                    grade_id: g.grade_id, student_id: s.student_id, student_name: s.full_name,
                    group_name: s.group_name, subject_id: sub.subject_id, subject_name: sub.subject_name,
                    teacher_id: t.teacher_id, teacher_name: t.full_name, grade: g.grade
                });
            }
        }
        fullJoinData = freshRows;
    }
    
    console.log("Итоговое количество строк (полный JOIN):", fullJoinData.length); // 184
    
    // ==================== ОТРИСОВКА ТАБЛИЦЫ И ПОИСК ====================
    const tbody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");
    const rowCounterSpan = document.getElementById("rowCounter");
    
    // Функция рендеринга таблицы
    function renderTable(dataArray) {
        if (!tbody) return;
        
        if (dataArray.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:40px;">❌ Ничего не найдено. Измените поиск.</td></tr>';
            rowCounterSpan.innerText = `0 строк (фильтр) · Всего в базе: ${fullJoinData.length} записей`;
            return;
        }
        
        // Используем DocumentFragment для лучшей производительности
        const fragment = document.createDocumentFragment();
        for (const row of dataArray) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.grade_id}</td>
                <td>${row.student_id}</td>
                <td>${escapeHtml(row.student_name)}</td>
                <td>${escapeHtml(row.group_name)}</td>
                <td>${row.subject_id}</td>
                <td>${escapeHtml(row.subject_name)}</td>
                <td>${row.teacher_id}</td>
                <td>${escapeHtml(row.teacher_name)}</td>
                <td><strong>${row.grade}</strong></td>
            `;
            fragment.appendChild(tr);
        }
        tbody.innerHTML = "";
        tbody.appendChild(fragment);
        rowCounterSpan.innerText = `Показано: ${dataArray.length} строк · Всего в базе: ${fullJoinData.length} записей (23 студента × 8 предметов)`;
    }
    
    // Простое экранирование для защиты от XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === "&") return "&amp;";
            if (m === "<") return "&lt;";
            if (m === ">") return "&gt;";
            return m;
        });
    }
    
    // ФИЛЬТРАЦИЯ (поиск по ВСЕМ полям)
    function filterTable(searchTerm) {
        const term = searchTerm.trim().toLowerCase();
        if (term === "") {
            renderTable(fullJoinData);
            return;
        }
        
        const filtered = fullJoinData.filter(row => {
            // Проверяем все поля на вхождение подстроки
            const gradeIdStr = row.grade_id.toString();
            const studentIdStr = row.student_id.toString();
            const studentName = row.student_name.toLowerCase();
            const groupName = row.group_name.toLowerCase();
            const subjectIdStr = row.subject_id.toString();
            const subjectName = row.subject_name.toLowerCase();
            const teacherIdStr = row.teacher_id.toString();
            const teacherName = row.teacher_name.toLowerCase();
            const gradeStr = row.grade.toString();
            
            if (gradeIdStr.includes(term)) return true;
            if (studentIdStr.includes(term)) return true;
            if (studentName.includes(term)) return true;
            if (groupName.includes(term)) return true;
            if (subjectIdStr.includes(term)) return true;
            if (subjectName.includes(term)) return true;
            if (teacherIdStr.includes(term)) return true;
            if (teacherName.includes(term)) return true;
            if (gradeStr.includes(term)) return true;
            return false;
        });
        
        renderTable(filtered);
    }
    
    // Обработчик ввода с небольшой задержкой для плавности
    let debounceTimer;
    function onSearchInput() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            filterTable(searchInput.value);
        }, 200);
    }
    
    // Инициализация страницы
    function init() {
        renderTable(fullJoinData);
        searchInput.addEventListener("input", onSearchInput);
        console.log("✅ Таблица загружена! Строк:", fullJoinData.length);
    }
    
    // Запускаем после загрузки DOM
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>

</body>
</html>
