<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Қолжетімді форма</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
}

form {
  width: 300px;
  margin: 50px auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
}

label {
  display: block;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

.error {
  color: red;
  font-size: 12px;
}
</style>
</head>

<body>

<form>

  <label for="name">Аты-жөні</label>
  <input id="name" type="text" aria-describedby="nameError">
  <div id="nameError" class="error">Аты-жөнін енгізіңіз</div>

  <label for="email">Email</label>
  <input id="email" type="email" aria-describedby="emailError">
  <div id="emailError" class="error">Дұрыс email жазыңыз</div>

  <label for="password">Пароль</label>
  <input id="password" type="password" aria-describedby="passError">
  <div id="passError" class="error">Пароль кемінде 6 символ болуы керек</div>

  <button type="submit">Жіберу</button>

</form>

</body>
</html>
